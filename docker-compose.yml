services:
  mongodb:
    image: mongo:7
    container_name: threat-agent-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    image: python:3.11-slim
    container_name: threat-agent-api
    working_dir: /app/agent-python
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: threat_intel
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    command: sh -c "pip install --no-cache-dir -r requirements.txt && PYTHONPATH=src uvicorn api.app:app --host 0.0.0.0 --port 8000"

  worker:
    image: python:3.11-slim
    container_name: threat-agent-worker
    working_dir: /app/agent-python
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: threat_intel
    depends_on:
      - mongodb
    command: sh -c "pip install --no-cache-dir -r requirements.txt && PYTHONPATH=src python src/main.py --source all --run-once"
    profiles:
      - worker

  frontend:
    image: node:20-alpine
    container_name: threat-agent-frontend
    working_dir: /app/agent-python/frontend
    volumes:
      - .:/app
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mongo-data:
