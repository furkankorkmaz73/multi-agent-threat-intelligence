services:
  mongodb:
    image: mongo:7
    container_name: threat-agent-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./agent-python
    container_name: threat-agent-api
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: threat_intel
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  worker:
    build:
      context: ./agent-python
    container_name: threat-agent-worker
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: threat_intel
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["python", "src/main.py", "--source", "all", "--run-once"]
    profiles:
      - worker

  frontend:
    build:
      context: ./agent-python/frontend
    container_name: threat-agent-frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo-data:
